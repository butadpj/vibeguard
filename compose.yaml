services:
  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    init: true
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      VIBEGUARD_HOST: 0.0.0.0
      VIBEGUARD_WORKSPACE: /data/vibeguard
      VIBEGUARD_OLLAMA_URL: '${VIBEGUARD_OLLAMA_URL:-http://host.docker.internal:11434}'
      VIBEGUARD_GOAL_PROVIDER: '${VIBEGUARD_GOAL_PROVIDER:-ollama}'
      VIBEGUARD_GOAL_CLOUD_MODEL: '${VIBEGUARD_GOAL_CLOUD_MODEL:-}'
      VIBEGUARD_CLOUD_MODEL: '${VIBEGUARD_CLOUD_MODEL:-}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      VIBEGUARD_GOAL_MODEL: '${VIBEGUARD_GOAL_MODEL:-qwen2.5-coder:7b}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - runner-data:/data/vibeguard
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  runner-data:
