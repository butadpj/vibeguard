# Prepare the Linux binary with scripts/prepare-jevos.py --platform linux first.
services:
  runner:
    environment:
      VIBEGUARD_JEVOS_URL: http://jevos:8017
      VIBEGUARD_GOAL_PROVIDER: ollama
      VIBEGUARD_REPAIR_PROVIDER: ollama
    networks:
      - default
      - jevos-local
    depends_on:
      jevos:
        condition: service_healthy
  jevos:
    image: node:22-bookworm-slim
    platform: linux/amd64
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    entrypoint: ['/opt/jevos/jev']
    command:
      [
        serve,
        --host,
        0.0.0.0,
        --port,
        '8017',
        --threads,
        '2',
        --warmup,
        '0',
        --state-cache,
        '4',
        --state-cache-tokens,
        '2048',
      ]
    volumes:
      - ./.vibeguard/jevos/jev:/opt/jevos:ro
    networks:
      - jevos-local
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8017/health').then(async r => process.exit(r.ok && (await r.json()).model === 'jevos-v4' ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 12

networks:
  jevos-local:
    internal: true
