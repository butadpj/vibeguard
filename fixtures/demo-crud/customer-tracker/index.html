<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer tracker · VibeGuard demo</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <p>Local demo · synthetic customers</p>
      <h1>Customer tracker</h1>
      <form id="customer-form">
        <label>Name <input name="name" required maxlength="100" /></label>
        <label>Email <input name="email" type="email" required maxlength="200" /></label>
        <button type="submit">Save customer</button>
        <button id="cancel" type="button">Cancel edit</button>
      </form>
      <p id="status" role="status">Connecting to the local database…</p>
      <button id="refresh" type="button">Refresh customers</button>
      <table>
        <caption>Saved customers</caption>
        <thead><tr><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
        <tbody id="customers"></tbody>
      </table>
    </main>
  </body>
</html>
