pid /tmp/nginx.pid;
error_log /dev/stderr;
events {}
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  location = /health { default_type text/plain; return 200 'web alive\n'; }
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }
  # Serve only the app; do not expose setup files or SQL over HTTP.
  location ~ ^/(index\.html|app\.js|client\.js|config\.js|customers\.js|styles\.css|vendor/supabase\.js)$ {
    try_files $uri =404;
  }
  location = / { try_files /index.html =404; }
  location / { return 404; }
}
}
